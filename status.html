<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Orders - Sip & Chill</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --black:#111;
    --beige:#F5F0E8;
    --accent:#C8B6A6;
    --gray-bg: #FAF8F5;
    --text-muted: #7A7570;
    --success: #4CAF50;
    --card-bg: #ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background: linear-gradient(-45deg, #F5F0E8, #efe3d6, #f5f0e8, #e9dccb);
    background-size: 400% 400%;
    animation: bgMove 15s ease infinite;
    padding: 0 0 60px 0;
    color: var(--black);
    min-height: 100vh;
}

@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* CUSTOM ENTERTAINING SCROLLBAR */
::-webkit-scrollbar {
    width: 8px;
}
::-webkit-scrollbar-track {
    background: var(--beige);
}
::-webkit-scrollbar-thumb {
    background: var(--black);
    border-radius: 10px;
}

nav{
    background:var(--black);
    padding:18px 8%;
    color:var(--beige);
    display:flex;
    justify-content:space-between;
    align-items:center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    margin-bottom: 40px;
}

nav a {
    color:var(--beige);
    text-decoration:none;
    font-weight:500;
    transition: all 0.2s ease;
    display: inline-block;
}

nav a:hover {
    color: #fff;
    transform: translateX(-3px);
}

.container {
    max-width: 650px;
    margin: 0 auto;
    padding: 0 20px;
}

h1 {
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 25px;
    letter-spacing: -0.5px;
    text-align: center;
    animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* CARDS WITH ENHANCED FLY-IN ANIMATIONS */
.order-card {
    background: var(--card-bg);
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(17,17,17,0.03);
    margin-bottom: 25px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    position: relative;
    border: 1px solid rgba(255,255,255,0.7);
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    opacity: 0;
    transform: translateY(30px);
    animation: slideUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.order-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(17,17,17,0.09);
}

@keyframes slideUpIn {
    to { opacity: 1; transform: translateY(0); }
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    padding-bottom: 14px;
}

.order-id {
    font-weight: 700;
    font-size: 17px;
    color: var(--black);
    display: flex;
    align-items: center;
    gap: 6px;
}

.status-badge {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
}

.status-pending {
    background: #FFF3E0;
    color: #E65100;
    animation: pulseOrange 2s infinite;
}

@keyframes pulseOrange {
    0% { box-shadow: 0 0 0 0 rgba(230, 81, 0, 0.2); }
    70% { box-shadow: 0 0 0 6px rgba(230, 81, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(230, 81, 0, 0); }
}

.status-completed {
    background: #E8F5E9;
    color: #2E7D32;
}

.order-details {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.7;
    background: #FAF7F2;
    padding: 15px;
    border-radius: 14px;
}

.order-details div {
    margin-bottom: 4px;
}
.order-details div:last-child {
    margin-bottom: 0;
}

.order-details strong, .order-details b {
    color: var(--black);
}

.order-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 5px;
}

.order-total {
    font-size: 20px;
    font-weight: 700;
    color: var(--black);
}

/* SHINY INTERACTIVE ACTION BUTTONS */
.action-btn {
    padding: 10px 22px;
    background: var(--black);
    color: var(--beige);
    border: none;
    border-radius: 25px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.action-btn:hover {
    transform: scale(1.05) translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.18);
}
.action-btn:active {
    transform: scale(1) translateY(0);
}

.score-tag {
    font-size: 13px;
    font-weight: 600;
    color: #DAA520;
    background: rgba(218, 165, 32, 0.08);
    padding: 4px 12px;
    border-radius: 20px;
}

.no-orders {
    text-align: center;
    padding: 45px 20px;
    background: #fff;
    border-radius: 24px;
    color: var(--text-muted);
    box-shadow: 0 10px 30px rgba(17,17,17,0.03);
}

/* GLASSMORPHISM RATING MODAL BOX */
.modal-overlay {
    display: none;
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    background: rgba(17,17,17,0.4);
    backdrop-filter: blur(8px);
    justify-content: center;
    align-items: center;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.modal-overlay.active {
    display: flex;
    opacity: 1;
}

.modal-box {
    background: rgba(255, 255, 255, 0.96);
    border-radius: 28px;
    padding: 35px;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 25px 55px rgba(0,0,0,0.2);
    transform: scale(0.8);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-overlay.active .modal-box {
    transform: scale(1);
}

.modal-box h3 {
    font-size: 24px;
    margin-bottom: 8px;
    color: var(--black);
}

.stars-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 25px 0;
}

.star {
    font-size: 38px;
    cursor: pointer;
    color: #e0e0e0;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.15s;
}

.star:hover {
    transform: scale(1.25);
}

.star.active {
    color: #FFD700;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
}

.submit-rating-btn {
    width: 100%;
    padding: 14px;
    background: var(--black);
    color: var(--beige);
    border: none;
    border-radius: 16px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
}

.submit-rating-btn:hover {
    background: #333;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}
</style>
</head>
<body>

<nav>
    <div style="font-weight:700; font-size:22px;">Sip & Chill ☕ Orders </div>
    <a href="menu.html">Back to Menu</a>
</nav>

<div class="container">
    <h1>Order Status History</h1>
    <div id="ordersWrapper"></div>
</div>

<!-- RATING MODAL -->
<div class="modal-overlay" id="ratingModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-box">
        <h3>Rate Your Experience</h3>
        <p style="font-size: 13px; color: var(--text-muted);">How was your Drink & Delivery setup?</p>
        
        <div class="stars-container" id="starsContainer">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
        </div>
        
        <button class="submit-rating-btn" onclick="submitRating()">Confirm & Submit</button>
    </div>
</div>

<script>
let activeRatingOrderId = null;
let chosenRatingValue = 5; 

function loadOrdersTimeline() {
    const wrapper = document.getElementById("ordersWrapper");
    const orders = JSON.parse(localStorage.getItem("sipChillOrders")) || [];

    if (orders.length === 0) {
        wrapper.innerHTML = `
            <div class="no-orders" style="animation: slideUpIn 0.5s ease forwards;">
                <p style="font-weight:600; margin-bottom:12px; font-size:16px;">No active transactions yet.</p>
                <a href="menu.html" style="color:var(--black); font-size:14px; text-decoration:underline; font-weight:600;">Go order custom items first</a>
            </div>`;
        return;
    }

    wrapper.innerHTML = "";
    orders.slice().reverse().forEach((order, index) => {
        const isPending = order.status === "Pending";
        const badgeClass = isPending ? "status-pending" : "status-completed";
        
        let footerActionElement = "";
        if (isPending) {
            footerActionElement = `<button class="action-btn" onclick="promptReceivedFlow('${order.orderId}')">Mark Received</button>`;
        } else {
            footerActionElement = `<span class="score-tag">Your Score: ${"★".repeat(order.rating || 5)}</span>`;
        }

        // Stagger the cards animation introduction loop frame
        const delay = index * 0.1;

        wrapper.innerHTML += `
            <div class="order-card" style="animation-delay: ${delay}s">
                <div class="order-header">
                    <span class="order-id">📦 ${order.orderId}</span>
                    <span class="status-badge ${badgeClass}">${order.status}</span>
                </div>
                <div class="order-details">
                    <div><b>Method:</b> ${order.method === 'delivery' ? '🛵 Delivery' : '🏃 Pickup'}</div>
                    <div><b>Dest/Ref:</b> ${order.locationInfo}</div>
                    <div><b>Quantity:</b> ${order.itemsCount} total item(s)</div>
                    <div style="font-size:11px; color:#aaa; margin-top:6px; border-top:1px dashed #e5dec9; padding-top:4px;">Placed on: ${order.timestamp}</div>
                </div>
                <div class="order-footer">
                    <div class="order-total">₱${order.totalAmount}</div>
                    <div>${footerActionElement}</div>
                </div>
            </div>
        `;
    });
}

function promptReceivedFlow(orderId) {
    activeRatingOrderId = orderId;
    chosenRatingValue = 5; 
    
    updateStarHighlight(5);
    const modal = document.getElementById("ratingModal");
    modal.style.display = "flex";
    setTimeout(() => modal.classList.add("active"), 10);
}

function closeModalOnOverlay(e) {
    if(e.target.id === "ratingModal") {
        const modal = document.getElementById("ratingModal");
        modal.classList.remove("active");
        setTimeout(() => modal.style.display = "none", 300);
    }
}

document.querySelectorAll('.star').forEach(star => {
    star.addEventListener('click', (e) => {
        const val = parseInt(e.target.getAttribute('data-value'));
        chosenRatingValue = val;
        updateStarHighlight(val);
    });
});

function updateStarHighlight(ratingVal) {
    document.querySelectorAll('.star').forEach(star => {
        const starVal = parseInt(star.getAttribute('data-value'));
        if(starVal <= ratingVal) {
            star.classList.add('active');
        } else {
            star.classList.remove('active');
        }
    });
}

function submitRating() {
    if (!activeRatingOrderId) return;
    
    let orders = JSON.parse(localStorage.getItem("sipChillOrders")) || [];
    
    orders = orders.map(order => {
        if (order.orderId === activeRatingOrderId) {
            order.status = "Completed";
            order.rating = chosenRatingValue;
        }
        return order;
    });
    
    localStorage.setItem("sipChillOrders", JSON.stringify(orders));
    
    const modal = document.getElementById("ratingModal");
    modal.classList.remove("active");
    setTimeout(() => {
        modal.style.display = "none";
        activeRatingOrderId = null;
        loadOrdersTimeline();
    }, 300);
}

loadOrdersTimeline();
</script>
</body>
</html>
